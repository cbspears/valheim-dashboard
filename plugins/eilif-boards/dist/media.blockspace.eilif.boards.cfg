## Settings file was created by plugin Eilif Boards v0.2.0
## Plugin GUID: media.blockspace.eilif.boards

[Discovery]

## Seconds between discovery scans (which find newly marked signs and refresh the claimed-sign cache). The scan is spread over many frames and never walks the whole ZDO store in one go.
# Setting type: Int32
# Default value: 300
# Acceptable value range: From 60 to 86400
ScanSeconds = 300

[Feed]

## The dashboard's boards feed. Returns JSON: {"generatedAt":"..","boards":{"kills":"..","deaths":"..","builds":"..","resources":"..","explored":"..","distance":"..","titles":"..","deeds":".."},"data":{..}}
# Setting type: String
# Default value: https://eilif-dashboard.vercel.app/api/boards
Url = https://eilif-dashboard.vercel.app/api/boards

## Sent as 'Authorization: Bearer <Token>'. Must match the dashboard's BOARDS_TOKEN. SERVER-ONLY secret - it never ships in a player-facing pack. If empty, the plugin logs one error and stays dormant.
# Setting type: String
# Default value:
Token = __BOARDS_TOKEN__

## Seconds between feed polls. The feed has its own 30s server-side cache, so anything below ~30 buys nothing.
# Setting type: Int32
# Default value: 60
# Acceptable value range: From 15 to 3600
PollSeconds = 60

[General]

## Master switch. When false the plugin loads and does nothing at all (no polling, no scanning, no writes).
# Setting type: Boolean
# Default value: true
Enabled = true

